name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # built-in TypeScript type-stripping (>=23.6)

      - name: Show toolchain
        run: clang++ --version && python3 --version && node --version

      # Builds rosegoldc, golden-snapshots every runnable example, asserts the
      # error fixtures are rejected, cross-checks C++/Python parity on the shared
      # core, snapshots the LSP drivers and embedding demos, and verifies the
      # builtin tables stay in sync across compiler / type-checker / VM.
      - name: Run test suite
        run: make test

      # Verifies the TypeScript compiler port (ts/) stays byte-identical to the
      # canonical tool on every example — lexer vs `--tokens`, parser vs `--ast`,
      # checker vs `--check`, compiler vs `--bytecode` (stdout, stderr, and exit
      # code). Runs after `make test` has built cpp/rosegoldc.
      - name: TypeScript compiler parity
        run: node ts/test/parity.mjs
